<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SOURCÉ</title>
  <style>
    /* Polices embarquées (pas d'appel à Google Fonts) — voir fonts/licenses */
    @font-face { font-family: 'FCT Archivo'; font-style: normal; font-weight: 400 800; src: url('fonts/archivo-latin.woff2') format('woff2'); }
    @font-face { font-family: 'FCT Newsreader'; font-style: italic; font-weight: 400 500; src: url('fonts/newsreader-italic-latin.woff2') format('woff2'); }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      padding: 18px 18px 16px;
      background: #0d0f13;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'FCT Archivo', system-ui, sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .fct-header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 16px;
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .fct-ping {
      position: relative;
      width: 8px;
      height: 8px;
      flex-shrink: 0;
    }
    .fct-ping-core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #e0324f;
      opacity: 0.35;
      transition: opacity 0.3s;
    }
    .fct-ping-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #e0324f;
      animation: fct-ping 1.8s ease-out infinite;
      display: none;
    }
    .active .fct-ping-core { opacity: 1; }
    .active .fct-ping-ring { display: block; }

    .fct-brand {
      font-family: 'FCT Newsreader', serif;
      font-style: italic;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      flex-shrink: 0;
    }
    .fct-brand-dot { color: #e0324f; }

    /* Une seule ligne quoi qu'il arrive : un statut long passait à la ligne
       et faisait sauter l'en-tête */
    .fct-status-pill {
      margin-left: auto;
      min-width: 0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.3s;
    }
    .fct-status-pill.active {
      color: #f0435f;
    }

    /* ── Form ── */
    .fct-section { margin-bottom: 9px; }
    .fct-label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.58);
      margin-bottom: 5px;
    }
    .fct-label-hint { opacity: 0.8; text-transform: none; letter-spacing: 0; font-weight: 500; }

    input, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 12px;
      font-family: 'FCT Archivo', system-ui, sans-serif;
      transition: border-color 0.15s, background 0.15s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: rgba(224, 50, 79, 0.6);
      background: rgba(255, 255, 255, 0.06);
    }
    input::placeholder, textarea::placeholder { color: rgba(255, 255, 255, 0.4); }
    textarea { resize: none; height: 62px; }

    /* ── Buttons ── */
    .fct-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 12.5px;
      font-weight: 600;
      font-family: 'FCT Archivo', system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      margin-top: 6px;
    }
    .fct-btn:focus-visible, .fct-advanced-toggle:focus-visible, .fct-link:focus-visible {
      outline: 2px solid rgba(240, 67, 95, 0.8);
      outline-offset: 2px;
    }

    #btn-start {
      background: #e0324f;
      color: #000; /* noir : 4,7:1 sur ce rouge (le quasi-noir d'avant faisait 4,3:1) */
    }
    #btn-start:hover { background: #ec4a65; }
    #btn-start:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.45);
      cursor: default;
    }

    #btn-stop {
      background: rgba(224, 50, 79, 0.1);
      color: #f28a9c;
      border: 1px solid rgba(224, 50, 79, 0.3);
      display: none;
    }
    #btn-stop:hover {
      background: rgba(224, 50, 79, 0.2);
      color: #ffb3c0;
    }

    .fct-note {
      font-size: 11px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.62);
      margin-top: 8px;
      display: none;
    }
    .fct-warn {
      font-size: 11px;
      line-height: 1.45;
      color: oklch(0.8 0.15 75);
      margin-top: 8px;
      display: none;
    }
    .fct-warn code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 10.5px;
      background: rgba(255, 255, 255, 0.07);
      padding: 1px 4px;
      border-radius: 4px;
    }
    .fct-link {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: #f28a9c;
      text-decoration: underline;
      cursor: pointer;
    }

    .fct-advanced-toggle {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-family: 'FCT Archivo', system-ui, sans-serif;
      cursor: pointer;
      padding: 2px 0;
    }
    .fct-advanced-toggle:hover { color: rgba(255, 255, 255, 0.8); }
    #advanced-panel { margin-top: 8px; }

    @keyframes fct-ping {
      0%   { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="fct-header" id="fct-header">
    <div class="fct-ping" id="fct-ping">
      <div class="fct-ping-core"></div>
      <div class="fct-ping-ring"></div>
    </div>
    <span class="fct-brand">SOURC<span class="fct-brand-dot">É</span></span>
    <span class="fct-status-pill" id="status-text" role="status">inactif</span>
  </div>

  <div id="briefing-section">
    <div class="fct-section">
      <label class="fct-label" for="emission">Émission</label>
      <input id="emission" type="text" placeholder="C à vous, BFM Politique…" />
    </div>
    <div class="fct-section">
      <label class="fct-label" for="guests">Intervenants <span class="fct-label-hint">(un par ligne — déduits de la vidéo)</span></label>
      <textarea id="guests" placeholder="Détectés automatiquement via la description.&#10;Complète ici si besoin (Prénom Nom)…"></textarea>
    </div>

    <button type="button" class="fct-advanced-toggle" id="advanced-toggle" aria-expanded="false" aria-controls="advanced-panel">Avancé ▾</button>
    <div id="advanced-panel" style="display:none">
      <label class="fct-label" for="token">Jeton d'accès <span class="fct-label-hint">(si BACKEND_TOKEN est défini côté serveur)</span></label>
      <input id="token" type="password" placeholder="Laisser vide si non configuré" autocomplete="off" />
    </div>
  </div>

  <button class="fct-btn" id="btn-start">▶ Démarrer l'analyse</button>
  <button class="fct-btn" id="btn-stop">■ Arrêter</button>
  <p class="fct-note" id="other-tab">L'analyse tourne sur un autre onglet. <button type="button" class="fct-link" id="goto-tab">Y aller</button></p>
  <p class="fct-warn" id="warn">⚠ Backend éteint — lance <code>python backend.py</code>, puis <button type="button" class="fct-link" id="retry">réessaie</button>.</p>
  <p class="fct-warn" id="search-warn">⚠ Recherche web éteinte : les verdicts seront rarement sourcés. Lance Docker, puis <code>docker compose up -d</code> dans <code>searxng/</code>.</p>

  <script src="popup.js"></script>
</body>
</html>
