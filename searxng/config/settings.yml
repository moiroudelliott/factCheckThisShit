# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

# Moteurs volontairement limités : ni Google ni Bing/Yahoo (ni aucun moteur qui
# leur sous-traite son index) — cf. ARCHITECTURE.md. Tous à index propre :
# - Brave (scraping) : suspendu au moindre excès de requêtes — la recherche
#   principale passe par l'API officielle de Brave (clé BRAVE_API_KEY) ;
# - Yep (index d'Ahrefs) et Seznam (index tchèque, bonne couverture de la
#   presse française) : relais quand l'API Brave ne répond pas (crédit
#   épuisé, cas vécu en plein débat) ;
# - Wikipédia en français, recherche plein texte : faits datés, fonctions,
#   chronologies.
# Retirés (essai d'octobre 2026) : Qwant (CAPTCHA), DuckDuckGo (CAPTCHA dès
# la deuxième requête, et index Bing), Mojeek, Startpage, Marginalia, Stract,
# Presearch (aucun résultat), Mwmbl (index trop petit), Google (accès refusé).
# Le moteur « wikipedia » fourni ne cherche qu'un titre d'article exact :
# inutile pour une affirmation.
use_default_settings:
  engines:
    keep_only:
      - brave
      - yep
      - seznam

engines:
  - name: wikipedia fr
    engine: mediawiki
    shortcut: wpfr
    base_url: "https://fr.wikipedia.org/"
    search_type: text
    categories: [general]
    timeout: 4.0
    disabled: false

server:
  secret_key: "u9nTuXtVVDrpzrbgt8BHm0HomEgCjno"
  image_proxy: true
  # Instance strictement locale (127.0.0.1, jamais exposée) : pas besoin du
  # rate-limiter anti-bot (qui exigerait Redis) pour autoriser l'API JSON.
  limiter: false

search:
  formats:
    - html
    - json
  # Un moteur qui répond « trop de requêtes » est suspendu : 1 h par défaut,
  # soit, après une seule rafale (plusieurs affirmations vérifiées d'un coup),
  # la fin du débat sans aucune recherche web. Brave redevient vite
  # disponible : on réessaie au bout d'une minute.
  suspended_times:
    SearxEngineTooManyRequests: 60
