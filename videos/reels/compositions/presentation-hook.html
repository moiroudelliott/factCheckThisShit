<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /></head>
<body>
<template id="presentation-hook-template">
<div data-composition-id="presentation-hook" data-width="1080" data-height="1920" data-duration="2.648">
<style>

@font-face { font-family: 'SRC Archivo'; font-style: normal; font-weight: 100 900; src: url('assets/fonts/archivo-latin.woff2') format('woff2'); }
@font-face { font-family: 'SRC Newsreader'; font-style: normal; font-weight: 200 800; src: url('assets/fonts/newsreader-latin.woff2') format('woff2'); }
@font-face { font-family: 'SRC Newsreader'; font-style: italic; font-weight: 200 800; src: url('assets/fonts/newsreader-italic-latin.woff2') format('woff2'); }
@font-face { font-family: 'SRC Plex Mono'; font-style: normal; font-weight: 400; src: url('assets/fonts/ibm-plex-mono-400-latin.woff2') format('woff2'); }
@font-face { font-family: 'SRC Plex Mono'; font-style: normal; font-weight: 500; src: url('assets/fonts/ibm-plex-mono-500-latin.woff2') format('woff2'); }

[data-composition-id="presentation-hook"] { position: absolute; inset: 0; overflow: hidden; background: #0d0e12; color: #fff; font-family: 'SRC Archivo', sans-serif; }
[data-composition-id="presentation-hook"] .abs { position: absolute; }
[data-composition-id="presentation-hook"] .glow { position: absolute; inset: 0; background: radial-gradient(900px 700px at 15% 95%, rgba(163,23,44,0.30), transparent 70%),
  radial-gradient(800px 600px at 90% 10%, rgba(238,96,96,0.10), transparent 70%); }
[data-composition-id="presentation-hook"] .logo { font-family: 'SRC Newsreader', serif; font-style: italic; font-weight: 500; line-height: 1; white-space: nowrap; }
[data-composition-id="presentation-hook"] .logo b { font-weight: 500; color: #ee6060; }
[data-composition-id="presentation-hook"] .flag { display: inline-block; flex: none; border-radius: 4px; background: linear-gradient(90deg, #0055a4 0 33.34%, #fff 33.34% 66.67%, #ef4135 66.67%); box-shadow: 0 0 0 2px rgba(255,255,255,0.15); }
[data-composition-id="presentation-hook"] .l { left: 72px; right: 72px; line-height: 1.02; }
[data-composition-id="presentation-hook"] .l1 { top: 620px; font-size: 96px; font-weight: 800; letter-spacing: -0.02em; color: rgba(255,255,255,0.75); }
[data-composition-id="presentation-hook"] .l2 { top: 740px; font-family: 'SRC Newsreader', serif; font-style: italic; font-weight: 500; font-size: 150px; }
</style>
<div class="glow"></div>
<div class="abs l l1" id="hk-1">Ils l’ont dit</div>
<div class="abs l l2" id="hk-2">à la télé…</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#hk-1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.1);
  tl.fromTo('#hk-2', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 1.277);
  tl.to(['#hk-1', '#hk-2'], { opacity: 0, y: -20, duration: 0.2, ease: 'power2.in' }, 2.448);
  window.__timelines['presentation-hook'] = tl;
})();
</script>
</div>
</template>
</body>
</html>
